# Development / custom UID-GID: use with -f compose.yaml -f deploy/compose.build.yaml.
services:
  web:
    image: kararecall-web:local
    pull_policy: build
    build:
      context: .
      target: web
      args:
        PUID: ${PUID:-10001}
        PGID: ${PGID:-10001}
  worker:
    image: kararecall-worker:local
    pull_policy: build
    build:
      context: .
      target: worker
      args:
        PUID: ${PUID:-10001}
        PGID: ${PGID:-10001}
