name: kararecall

services:
  web:
    build:
      context: .
      target: web
      args:
        PUID: ${PUID:-10001}
        PGID: ${PGID:-10001}
    ports:
      - "${KARARECALL_BIND_ADDRESS:-127.0.0.1}:${KARARECALL_PORT:-8765}:8765"
    environment:
      KARARECALL_USERNAME: ${KARARECALL_USERNAME:?Définir KARARECALL_USERNAME dans .env}
      KARARECALL_PASSWORD: ${KARARECALL_PASSWORD:?Définir KARARECALL_PASSWORD dans .env}
      STORAGE_MIN_FREE_MB: ${STORAGE_MIN_FREE_MB:-256}
      DIGEST_ENABLED: ${DIGEST_ENABLED:-false}
      DIGEST_WEEKLY: ${DIGEST_WEEKLY:-true}
      DIGEST_MONTHLY: ${DIGEST_MONTHLY:-true}
      DIGEST_TIMEZONE: ${DIGEST_TIMEZONE:-Europe/Paris}
      DIGEST_TIME: ${DIGEST_TIME:-08:00}
      DIGEST_WEEKDAY: ${DIGEST_WEEKDAY:-0}
      DIGEST_MONTHDAY: ${DIGEST_MONTHDAY:-1}
      DIGEST_SCOPE: ${DIGEST_SCOPE:-added}
      DIGEST_TRACK_VIEWS: ${DIGEST_TRACK_VIEWS:-false}
      DIGEST_WEEKLY_MAX_ITEMS: ${DIGEST_WEEKLY_MAX_ITEMS:-12}
      DIGEST_MONTHLY_MAX_ITEMS: ${DIGEST_MONTHLY_MAX_ITEMS:-24}
      DIGEST_AUTO_SEND: ${DIGEST_AUTO_SEND:-false}
      DIGEST_AUTO_APPROVE: ${DIGEST_AUTO_APPROVE:-false}
      KARARECALL_PUBLIC_URL: ${KARARECALL_PUBLIC_URL:-}
    volumes:
      - storage:/workspace
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 1.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
  worker:
    profiles: [automation]
    build:
      context: .
      target: worker
      args:
        PUID: ${PUID:-10001}
        PGID: ${PGID:-10001}
    environment:
      DIGEST_SEND_ENABLED: ${DIGEST_SEND_ENABLED:-false}
      DIGEST_CHANNELS: ${DIGEST_CHANNELS:-}
      DIGEST_SMTP_HOST: ${DIGEST_SMTP_HOST:-}
      DIGEST_SMTP_PORT: ${DIGEST_SMTP_PORT:-587}
      DIGEST_SMTP_TLS: ${DIGEST_SMTP_TLS:-starttls}
      DIGEST_SMTP_USERNAME: ${DIGEST_SMTP_USERNAME:-}
      DIGEST_SMTP_PASSWORD: ${DIGEST_SMTP_PASSWORD:-}
      DIGEST_EMAIL_FROM: ${DIGEST_EMAIL_FROM:-}
      DIGEST_EMAIL_TO: ${DIGEST_EMAIL_TO:-}
      DIGEST_WEBHOOK_URL: ${DIGEST_WEBHOOK_URL:-}
      DIGEST_WEBHOOK_TOKEN: ${DIGEST_WEBHOOK_TOKEN:-}
      SYNC_ENABLED: ${SYNC_ENABLED:-false}
      KARAKEEP_BASE_URL: ${KARAKEEP_BASE_URL:-}
      KARAKEEP_API_KEY: ${KARAKEEP_API_KEY:-}
      KARAKEEP_URL_FILTER: ${KARAKEEP_URL_FILTER:-}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-900}
      DOWNLOAD_MEDIA: ${DOWNLOAD_MEDIA:-true}
      REUSE_SUBTITLES: ${REUSE_SUBTITLES:-false}
      PDF_MAX_PAGES: ${PDF_MAX_PAGES:-25}
      PDF_OCR_ENABLED: ${PDF_OCR_ENABLED:-false}
      PDF_OCR_MAX_PAGES: ${PDF_OCR_MAX_PAGES:-3}
      IMAGE_OCR_ENABLED: ${IMAGE_OCR_ENABLED:-false}
      WEB_RESEARCH_ENABLED: ${WEB_RESEARCH_ENABLED:-false}
      DEEPSEEK_RESEARCH_API_KEY: ${DEEPSEEK_RESEARCH_API_KEY:-}
      WEB_REQUEST_USD: ${WEB_REQUEST_USD:-0.00075}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-3}
      MEDIA_MAX_MB: ${MEDIA_MAX_MB:-100}
      STORAGE_MIN_FREE_MB: ${STORAGE_MIN_FREE_MB:-256}
      DIGEST_ENABLED: ${DIGEST_ENABLED:-false}
      DIGEST_WEEKLY: ${DIGEST_WEEKLY:-true}
      DIGEST_MONTHLY: ${DIGEST_MONTHLY:-true}
      DIGEST_TIMEZONE: ${DIGEST_TIMEZONE:-Europe/Paris}
      DIGEST_TIME: ${DIGEST_TIME:-08:00}
      DIGEST_WEEKDAY: ${DIGEST_WEEKDAY:-0}
      DIGEST_MONTHDAY: ${DIGEST_MONTHDAY:-1}
      DIGEST_SCOPE: ${DIGEST_SCOPE:-added}
      DIGEST_TRACK_VIEWS: ${DIGEST_TRACK_VIEWS:-false}
      DIGEST_WEEKLY_MAX_ITEMS: ${DIGEST_WEEKLY_MAX_ITEMS:-12}
      DIGEST_MONTHLY_MAX_ITEMS: ${DIGEST_MONTHLY_MAX_ITEMS:-24}
      DIGEST_AUTO_SEND: ${DIGEST_AUTO_SEND:-false}
      DIGEST_AUTO_APPROVE: ${DIGEST_AUTO_APPROVE:-false}
      KARARECALL_PUBLIC_URL: ${KARARECALL_PUBLIC_URL:-}
      MEDIA_MAX_SECONDS: ${MEDIA_MAX_SECONDS:-300}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-120}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MAX_INPUT_CHARS: ${LLM_MAX_INPUT_CHARS:-24000}
      LLM_DOCUMENT_SECTIONS: ${LLM_DOCUMENT_SECTIONS:-0}
      ASR_BASE_URL: ${ASR_BASE_URL:-}
      ASR_API_KEY: ${ASR_API_KEY:-}
      ASR_MODEL: ${ASR_MODEL:-}
      VISION_BASE_URL: ${VISION_BASE_URL:-}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-}
      VISION_INTERVAL_SECONDS: ${VISION_INTERVAL_SECONDS:-5}
      VISION_MAX_FRAMES: ${VISION_MAX_FRAMES:-12}
      VISION_SAMPLE_MODE: ${VISION_SAMPLE_MODE:-regular}
      KARAKEEP_TAG_FILTER: ${KARAKEEP_TAG_FILTER:-}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2000}
      VISION_MAX_OUTPUT_TOKENS: ${VISION_MAX_OUTPUT_TOKENS:-600}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      VISION_REASONING_EFFORT: ${VISION_REASONING_EFFORT:-}
      LLM_THINKING: ${LLM_THINKING:-}
      VISION_THINKING: ${VISION_THINKING:-}
      AI_TOKEN_LIMIT_PARAM: ${AI_TOKEN_LIMIT_PARAM:-max_completion_tokens}
      ASR_SEGMENT_TIMESTAMPS: ${ASR_SEGMENT_TIMESTAMPS:-true}
      AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-2.00}
      AI_CALL_RESERVE_USD: ${AI_CALL_RESERVE_USD:-0.05}
      AI_MAX_CALLS_PER_DAY: ${AI_MAX_CALLS_PER_DAY:-50}
      AI_MAX_CALLS_PER_MONTH: ${AI_MAX_CALLS_PER_MONTH:-400}
      LLM_INPUT_USD_PER_MILLION: ${LLM_INPUT_USD_PER_MILLION:-0}
      LLM_OUTPUT_USD_PER_MILLION: ${LLM_OUTPUT_USD_PER_MILLION:-0}
      VISION_INPUT_USD_PER_MILLION: ${VISION_INPUT_USD_PER_MILLION:-0}
      VISION_OUTPUT_USD_PER_MILLION: ${VISION_OUTPUT_USD_PER_MILLION:-0}
      ASR_USD_PER_HOUR: ${ASR_USD_PER_HOUR:-0}
    volumes:
      - storage:/workspace
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  storage:
    name: ${KARARECALL_VOLUME_NAME:-kararecall-storage}
