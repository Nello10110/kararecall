<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1136" viewBox="0 0 1320 1136" role="img" aria-labelledby="title desc">
<title id="title">Architecture fonctionnelle de KaraRecall : traitements locaux et étapes IA</title>
<desc id="desc">Karakeep est lu sans modification. Sur le NAS, KaraRecall importe les favoris, prépare les textes et médias, conserve une bibliothèque privée et permet la consultation et la recherche par mots sans appel IA. Sur activation, des services IA transcrivent le son, lisent les images, rédigent les synthèses et les bulletins. Une recherche web facultative fournit des pages pour enrichir les descriptions avec un LLM. Les résultats sont conservés avec leurs références. Les modèles sont hébergés séparément, sur une machine locale ou chez un fournisseur API.</desc>
