    .heading { fill:#f2f6ff; font-weight:600; font-size:22px; }
    .copy { fill:#c5d1e4; font-size:18px; }
    .small { fill:#b1c2d9; font-size:16px; }
    .label { fill:#91dded; font-size:15px; font-weight:650; letter-spacing:1.4px; }
    .line { fill:none; stroke:#80d9ee; stroke-width:2.5; marker-end:url(#blue); }
    .optional { fill:none; stroke:#c4b5fd; stroke-width:2.5; stroke-dasharray:7 6; marker-end:url(#purple); }
  </style>
</defs>
