name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q kararecall.py kararecall_mcp.py web_server.py settings.py integrations.py worker.py source_enrichment.py worker_media.py worker_documents.py web_research.py editorial.py publication.py usage.py controls.py reading.py digests.py digest_delivery.py digest_writer.py curation.py overview.py version.py scripts
      - run: node --check web/app.js && node --check web/workspace.js && node --check web/digests.js && node --check web/details.js
      - run: node --test tests_js/*.test.cjs
      - run: python scripts/check_container.py
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target worker --tag kararecall-worker:test .
      - run: docker run --rm --mount "type=bind,src=$PWD/tests,dst=/tests,readonly" -e PYTHONPATH=/app kararecall-worker:test python -m unittest discover -s /tests -p test_media_worker.py -v
      - run: docker run --rm --mount "type=bind,src=$PWD/tests,dst=/tests,readonly" -e PYTHONPATH=/app kararecall-worker:test python -m unittest discover -s /tests -p test_documents.py -v
      - run: docker run --rm --mount "type=bind,src=$PWD/tests,dst=/tests,readonly" -e PYTHONPATH=/app kararecall-worker:test python -m unittest discover -s /tests -p test_source_enrichment.py -v
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.mcp.txt
      - run: python -m unittest discover -s tests -p test_mcp_adapter.py -v
  publish:
    name: Publish ${{ matrix.target }}
    needs: [python, media, mcp]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [web, worker]
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.target }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=KaraRecall ${{ matrix.target }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
  latest:
    name: Promote tested pair to latest
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: kararecall-publish-latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote both images only after both builds succeed
        shell: bash
        run: |
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo 'A newer main commit exists; keep its publication in charge of latest.'
            exit 0
          fi
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          for target in web worker; do
            docker buildx imagetools inspect "${prefix}-${target}:sha-${GITHUB_SHA}"
          done
          for target in web worker; do
            docker buildx imagetools create --tag "${prefix}-${target}:latest" "${prefix}-${target}:sha-${GITHUB_SHA}"
          done
