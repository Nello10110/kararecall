name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q cerveau.py web_server.py settings.py integrations.py worker.py worker_media.py scripts
      - run: python scripts/check_container.py
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target worker --tag memoire-worker:test .
      - run: docker run --rm --mount "type=bind,src=$PWD/tests,dst=/tests,readonly" -e PYTHONPATH=/app memoire-worker:test python -m unittest discover -s /tests -p test_media_worker.py -v
